<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>梦境诊疗师 · 第一章</title>
<link rel="stylesheet" href="style.css">
<script defer src="story.js"></script><script defer src="game.js"></script>
</head>
<body>
<main id="main-menu" data-cover="dream" aria-labelledby="game-name">
  <img id="cover" src="assets/title-dream.webp" alt="" fetchpriority="high">
  <div class="menu-content">
    <p class="menu-scene" id="menu-scene">血红之梦</p>
    <h1 id="game-name">梦境诊疗师</h1>
    <p class="menu-credit">第一章 · 改编自守拙原作</p>
    <nav class="menu-actions" aria-label="主菜单">
      <button id="resume" hidden>继续游戏</button>
      <button id="start">开始游戏</button>
      <button id="menu-load" hidden>读取存档</button>
      <button id="menu-catalog">图鉴</button>
    </nav>
  </div>
</main>
<main id="game" data-scene="dream" hidden>
  <div id="backdrop"></div><div id="portrait" aria-hidden="true"></div>
  <header><div><span class="chapter">第一章</span><strong>梦境诊疗师</strong></div><nav aria-label="游戏菜单"><button id="catalog">图鉴</button><button id="history">回顾</button><button id="save">存档</button><button id="load">读档</button><button id="home">主界面</button></nav></header>
  <section id="reading">
    <div class="scene"><span id="title"></span><span id="progress"></span></div>
    <div class="panel" aria-live="polite">
      <h1 id="speaker"></h1><p id="line"></p><div id="choices"></div>
      <footer><span id="status" role="status"></span><button id="next">继续</button></footer>
    </div>
  </section>
</main>
<dialog id="overlay"><div class="dialog-head"><h2 id="dialog-title"></h2><form method="dialog"><button>关闭</button></form></div><div id="dialog-content"></div></dialog>
</body>
</html>
