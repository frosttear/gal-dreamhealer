name: Deploy game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build TyranoScript game
        run: python3 scripts/build-tyrano.py
      - name: Prepare Pages artifact
        run: |
          test -s dist/engine/index.html
          for chapter in 1 2 3; do test -s "dist/engine/data/scenario/chapter$chapter.ks" || exit 1; done
          mkdir -p _site
          cp -R dist _site/dist
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="zh-CN">
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=./dist/">
          <title>梦境诊疗师</title>
          <a href="./dist/">打开《梦境诊疗师》</a>
          </html>
          HTML
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
